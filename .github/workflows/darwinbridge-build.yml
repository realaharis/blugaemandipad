name: DarwinBridge iOS prototype

on:
  push:
    branches: ["feat/darwinbridge-macho-loader"]
    paths:
      - "DarwinBridge/**"
      - ".github/workflows/darwinbridge-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Core loader + dyld + runtime smoke tests
        working-directory: DarwinBridge
        run: |
          swiftc \
            Core/Models.swift \
            Core/MachOParser.swift \
            Core/FrameworkShimRegistry.swift \
            Core/CompatibilityAnalyzer.swift \
            Core/ChainedFixupsParser.swift \
            Core/SymbolBroker.swift \
            Core/FixupPlanner.swift \
            Core/GuestAddressSpace.swift \
            Tests/parser_smoke.swift \
            -o /tmp/darwinbridge-smoke
          /tmp/darwinbridge-smoke

      - name: Build controlled macOS ARM64 Mach-O
        working-directory: DarwinBridge
        run: |
          mkdir -p build/test-target
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          CLANG="$(xcrun --sdk macosx --find clang)"
          "$CLANG" \
            -target arm64-apple-macos13.0 \
            -isysroot "$SDK" \
            -Wl,-no_pie \
            Tests/real_macho_return42.c \
            -o build/test-target/darwinbridge-test-arm64

          file build/test-target/darwinbridge-test-arm64
          lipo -info build/test-target/darwinbridge-test-arm64
          otool -l build/test-target/darwinbridge-test-arm64 > build/test-target/load-commands.txt

          grep -A 4 "segname __TEXT" build/test-target/load-commands.txt
          grep -A 4 "LC_MAIN" build/test-target/load-commands.txt

      - name: Build unsigned IPA
        working-directory: DarwinBridge
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: DarwinBridge-unsigned-ipa
          path: DarwinBridge/build/DarwinBridge-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DarwinBridge-real-macho-test
          path: |
            DarwinBridge/build/test-target/darwinbridge-test-arm64
            DarwinBridge/build/test-target/load-commands.txt
