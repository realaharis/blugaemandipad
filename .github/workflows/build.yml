name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Which build to produce'
        type: choice
        default: Debug
        options: [Debug, Release]

# A newer push to the same branch makes the running build irrelevant.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # `inputs` is null on push and pull_request, so those always take Debug.
      - name: Resolve build type
        id: variant
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'Debug' }}
        run: |
          echo "name=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "lower=${BUILD_TYPE,,}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle user home and the configuration cache between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # GitHub's Ubuntu runner already ships with the Android SDK and sets ANDROID_HOME.
      # Do not run setup-android here: its default legacy "tools" package was removed
      # from Google's current SDK repository and makes the workflow fail before Gradle starts.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lint${{ steps.variant.outputs.name }} --stacktrace

      # All four secrets or none: a Release build with them signs, and without them comes out as
      # app-release-unsigned.apk, which is what a fork's pull request gets — secrets are not
      # exposed to those. Setting some but not all fails the build rather than silently producing
      # an unsigned APK; see keystore.properties.sample.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BLUGAEMAND_STOREFILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build ${{ steps.variant.outputs.name }} APK
        env:
          BLUGAEMAND_STOREPASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          BLUGAEMAND_KEYALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          BLUGAEMAND_KEYPASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assemble${{ steps.variant.outputs.name }} --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blugaemand-${{ steps.variant.outputs.lower }}-${{ github.sha }}
          path: app/build/outputs/apk/${{ steps.variant.outputs.lower }}/*.apk
          if-no-files-found: error

      # Kept separate from the APK so a red build still hands over the reports that
      # say why.
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ steps.variant.outputs.lower }}-${{ github.sha }}
          path: |
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 5
